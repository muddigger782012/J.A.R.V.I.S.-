plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.assistant.core'
    compileSdk 34

    defaultConfig {
        applicationId "com.assistant.core"
        minSdk 26
        targetSdk 34
        versionCode 24
        versionName "3.3-cloud"

        buildConfigField "String", "GITHUB_REPO_OWNER", "\"muddigger782012\""
        buildConfigField "String", "GITHUB_REPO_NAME", "\"J.A.R.V.I.S.-\""
        buildConfigField "String", "GITHUB_UPDATE_BRANCH", "\"main\""
        buildConfigField "boolean", "GITHUB_UPDATE_TOKEN_REQUIRED", "false"
    }

    buildFeatures {
        buildConfig true
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles(
                getDefaultProguardFile('proguard-android-optimize.txt'),
                "proguard-rules.pro"
            )
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.activity:activity-ktx:1.9.2'

    implementation 'dev.rikka.shizuku:api:13.1.5'
    implementation 'dev.rikka.shizuku:provider:13.1.5'
    implementation 'dev.rikka.shizuku:aidl:13.1.5'
    implementation 'io.github.iamr0s:Dhizuku-API:2.5.3'
    implementation 'ai.picovoice:porcupine-android:3.0.1'
}
