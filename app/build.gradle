plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.assistant.core'
    compileSdk 34

    defaultConfig {
        applicationId "com.assistant.core"
        minSdk 26
        targetSdk 34
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        // CI supplies monotonically increasing values from the GitHub Actions run number.
        // Local builds retain a safe baseline above all historical versionCode 24 installs.
        versionCode Integer.parseInt(System.getenv("JARVIS_VERSION_CODE") ?: "109")
        versionName "${System.getenv('JARVIS_VERSION_NAME') ?: '3.4.109'}"

        buildConfigField "String", "GITHUB_REPO_OWNER", "\"muddigger782012\""
        buildConfigField "String", "GITHUB_REPO_NAME", "\"J.A.R.V.I.S.-\""
        buildConfigField "String", "GITHUB_UPDATE_BRANCH", "\"main\""
        buildConfigField "boolean", "GITHUB_UPDATE_TOKEN_REQUIRED", "false"
        buildConfigField "String", "GITHUB_UPDATE_APK_PATH", "\"artifacts/app-debug.apk\""
        buildConfigField "String", "BETA_GEMINI_API_KEY", "\"\""
        buildConfigField "boolean", "BUNDLED_NEURAL_VOICES", "false"
        buildConfigField "String", "GITHUB_UPDATE_DOWNLOAD_URL", "\"\""
        resValue "string", "install_package", "com.assistant.core"
    }

    androidResources {
        noCompress += ["bz2"]
    }

    buildFeatures {
        buildConfig true
    }

    signingConfigs {
        release {
            def storePath = System.getenv("JARVIS_SIGNING_STORE_FILE")
            if (storePath) {
                storeFile file(storePath)
                storePassword System.getenv("JARVIS_SIGNING_STORE_PASSWORD")
                keyAlias System.getenv("JARVIS_SIGNING_KEY_ALIAS")
                keyPassword System.getenv("JARVIS_SIGNING_KEY_PASSWORD")
            }
        }
    }

    testBuildType System.getenv("JARVIS_TEST_BUILD_TYPE") ?: "debug"

    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled true
            shrinkResources true
            proguardFiles(
                getDefaultProguardFile('proguard-android-optimize.txt'),
                "proguard-rules.pro"
            )
        }
    }

    buildTypes {
        beta {
            initWith release
            applicationIdSuffix ".beta"
            versionNameSuffix "-beta"
            matchingFallbacks = ["release"]
            resValue "string", "install_package", "com.assistant.core.beta"
            buildConfigField "String", "GITHUB_UPDATE_APK_PATH", "\"artifacts/beta.apk\""
            buildConfigField "boolean", "BUNDLED_NEURAL_VOICES", "true"
            buildConfigField "String", "GITHUB_UPDATE_DOWNLOAD_URL", "\"https://github.com/muddigger782012/J.A.R.V.I.S.-/releases/download/beta-latest/Beta.apk\""
            // Build-time embedding keeps the key out of the public source tree.
            buildConfigField "String", "BETA_GEMINI_API_KEY", groovy.json.JsonOutput.toJson(System.getenv("JARVIS_BETA_GEMINI_API_KEY") ?: "")
        }
        voiceCheck {
            initWith release
            signingConfig signingConfigs.debug
            debuggable false
            matchingFallbacks = ["release"]
            // Instrumentation's Kotlin references are not visible to the host R8 pass.
            proguardFiles "voice-test-host.pro"
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }

    splits {
        abi {
            enable true
            reset()
            include 'arm64-v8a', 'armeabi-v7a', 'x86_64'
            universalApk false
        }
    }
}

dependencies {
    implementation files('libs/sherpa-onnx-1.13.8.aar')
    implementation 'org.apache.commons:commons-compress:1.28.0'
    androidTestImplementation 'androidx.test:runner:1.5.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20240303'
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.activity:activity-ktx:1.9.2'

    implementation 'dev.rikka.shizuku:api:13.1.5'
    implementation 'dev.rikka.shizuku:provider:13.1.5'
    implementation 'dev.rikka.shizuku:aidl:13.1.5'
    implementation 'io.github.iamr0s:Dhizuku-API:2.5.3'
}
