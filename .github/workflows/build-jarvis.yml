name: Build Jarvis APK
on:
  push:
    branches: [main]
    paths-ignore:
      - 'artifacts/**'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: jarvis-main-apk-publisher
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Extract Jarvis project ZIP if present
        shell: bash
        run: |
          if ! test -f settings.gradle && ! test -f settings.gradle.kts; then
            if [ -f Jarvis-AI-cloud-build-v3.3.zip ]; then
              mkdir -p /tmp/jarvis-project
              unzip -q Jarvis-AI-cloud-build-v3.3.zip -d /tmp/jarvis-project
              cp -a /tmp/jarvis-project/. .
            fi
          fi
          (test -f settings.gradle || test -f settings.gradle.kts) || { echo 'Jarvis Android source is missing.'; exit 1; }
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: android-actions/setup-android@v4
      - name: Restore stable debug signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: jarvis-stable-debug-signing-v1
      - name: Install Android SDK
        run: sdkmanager 'platforms;android-34' 'build-tools;34.0.0'
      - name: Compile versioned debug APK
        env:
          JARVIS_VERSION_CODE: ${{ github.run_number }}
          JARVIS_VERSION_NAME: 3.4.${{ github.run_number }}
        run: |
          mkdir -p ~/.android
          chmod +x ./gradlew
          ./gradlew --no-daemon assembleDebug
      - name: Verify APK identity and signing
        shell: bash
        run: |
          APK="app/build/outputs/apk/debug/app-debug.apk"
          AAPT="$ANDROID_HOME/build-tools/34.0.0/aapt"
          APKSIGNER="$ANDROID_HOME/build-tools/34.0.0/apksigner"
          "$AAPT" dump badging "$APK" | head -n 1
          "$APKSIGNER" verify --print-certs "$APK"
          "$AAPT" dump badging "$APK" | head -n 1 | grep -q "name='com.assistant.core'"
          "$AAPT" dump badging "$APK" | head -n 1 | grep -q "versionCode='${{ github.run_number }}'"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Jarvis-debug-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
      - name: Publish APK for in-app updater
        shell: bash
        run: |
          apk_tmp="$(mktemp)"
          cp app/build/outputs/apk/debug/app-debug.apk "$apk_tmp"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git reset --hard origin/main
          mkdir -p artifacts
          cp "$apk_tmp" artifacts/app-debug.apk
          git add artifacts/app-debug.apk
          if git diff --cached --quiet; then
            echo "Published APK is unchanged."
          else
            git commit -m "Publish latest JARVIS updater APK [skip ci]"
            git push origin HEAD:main
          fi
