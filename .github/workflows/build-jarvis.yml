name: Build Jarvis APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Extract Jarvis project ZIP if present
        shell: bash
        run: |
          if [ -f Jarvis-AI-cloud-build-v3.3.zip ]; then
            mkdir -p /tmp/jarvis-project
            unzip -q Jarvis-AI-cloud-build-v3.3.zip -d /tmp/jarvis-project
            cp -a /tmp/jarvis-project/. .
          fi
          (test -f settings.gradle || test -f settings.gradle.kts) || { echo 'Upload Jarvis-AI-cloud-build-v3.3.zip to the repository root first.'; exit 1; }
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: android-actions/setup-android@v4
      - name: Install Android SDK
        run: sdkmanager 'platforms;android-34' 'build-tools;34.0.0'
      - name: Compile debug APK
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon assembleDebug
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Jarvis-debug-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
