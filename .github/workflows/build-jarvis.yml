name: Build Jarvis APK
on:
  push:
    branches: [main, codex/separate-update-channels]
    paths-ignore:
      - 'artifacts/**'
      - 'updates/**'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: jarvis-main-apk-publisher
  cancel-in-progress: false
jobs:
  build:
    if: github.repository == 'muddigger782012/J.A.R.V.I.S.-' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/codex/separate-update-channels')
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Require existing production credentials for encrypted candidates
        if: github.ref == 'refs/heads/codex/separate-update-channels'
        shell: bash
        env:
          JARVIS_SIGNING_KEY_B64: ${{ secrets.JARVIS_SIGNING_KEY_B64 }}
          JARVIS_SIGNING_STORE_PASSWORD: ${{ secrets.JARVIS_SIGNING_STORE_PASSWORD }}
          JARVIS_SIGNING_KEY_PASSWORD: ${{ secrets.JARVIS_SIGNING_KEY_PASSWORD }}
          JARVIS_SIGNING_KEY_ALIAS: ${{ secrets.JARVIS_SIGNING_KEY_ALIAS }}
          JARVIS_BETA_GEMINI_API_KEY: ${{ secrets.JARVIS_BETA_GEMINI_API_KEY }}
        run: |
          set -euo pipefail
          for required in JARVIS_SIGNING_KEY_B64 JARVIS_SIGNING_STORE_PASSWORD JARVIS_SIGNING_KEY_PASSWORD JARVIS_SIGNING_KEY_ALIAS JARVIS_BETA_GEMINI_API_KEY; do
            if [ -z "${!required}" ]; then
              echo '::error::Encrypted candidates require the existing production signing and Beta credentials; no candidate was built.'
              exit 1
            fi
          done
      - name: Extract Jarvis project ZIP if present
        shell: bash
        run: |
          if ! test -f settings.gradle && ! test -f settings.gradle.kts; then
            if [ -f Jarvis-AI-cloud-build-v3.3.zip ]; then
              mkdir -p /tmp/jarvis-project
              unzip -q Jarvis-AI-cloud-build-v3.3.zip -d /tmp/jarvis-project
              cp -a /tmp/jarvis-project/. .
            fi
          fi
          (test -f settings.gradle || test -f settings.gradle.kts) || { echo 'Jarvis Android source is missing.'; exit 1; }
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: android-actions/setup-android@v4
      - name: Prepare permanent JARVIS signing key
        id: signing
        shell: bash
        env:
          JARVIS_SIGNING_KEY_B64: ${{ secrets.JARVIS_SIGNING_KEY_B64 }}
          JARVIS_SIGNING_STORE_PASSWORD: ${{ secrets.JARVIS_SIGNING_STORE_PASSWORD }}
          JARVIS_SIGNING_KEY_PASSWORD: ${{ secrets.JARVIS_SIGNING_KEY_PASSWORD }}
          JARVIS_SIGNING_KEY_ALIAS: ${{ secrets.JARVIS_SIGNING_KEY_ALIAS }}
        run: |
          if [ -n "$JARVIS_SIGNING_KEY_B64" ] && [ -n "$JARVIS_SIGNING_STORE_PASSWORD" ] && [ -n "$JARVIS_SIGNING_KEY_PASSWORD" ] && [ -n "$JARVIS_SIGNING_KEY_ALIAS" ]; then
            printf '%s' "$JARVIS_SIGNING_KEY_B64" | base64 --decode > "$RUNNER_TEMP/jarvis-release.jks"
            chmod 600 "$RUNNER_TEMP/jarvis-release.jks"
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Permanent signing secrets are not configured; publishing is disabled for this run."
            echo "No signed APK was built or published: permanent signing configuration was unavailable." >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Install Android SDK
        run: sdkmanager 'platforms;android-34' 'build-tools;34.0.0'
      - name: Prepare existing Android runtime and production KWS assets
        run: bash scripts/prepare_android_runtime.sh
      - name: Verify dedicated male models and embed download metadata
        run: |
          timeout 600s python3 scripts/prepare_neural_voice.py --directory /tmp/jarvis-kokoro --metadata app/src/main/assets/neural-voice-pack.json --smoke --bundle app/src/beta/assets/voice-packs/kokoro.tar.bz2
      - name: Test bundled APK integrity checks
        run: python3 -m unittest discover -s scripts/tests -p 'test_*.py'
      - name: Verify native keyword decoder and run unit tests
        run: |
          timeout 60s python3 scripts/wake_decoder_smoke.py app/src/main/assets/sherpa-onnx-kws-zipformer-gigaspeech-3.3M-2024-01-01
          chmod +x ./gradlew
          ./gradlew --no-daemon testDebugUnitTest
      - name: Compile versioned release APK and universal legacy alias
        if: steps.signing.outputs.configured == 'true'
        env:
          JARVIS_VERSION_CODE: ${{ github.run_number }}
          JARVIS_VERSION_NAME: 3.5.${{ github.run_number }}
          JARVIS_UNIVERSAL_APK: 'true'
          JARVIS_SIGNING_STORE_FILE: ${{ runner.temp }}/jarvis-release.jks
          JARVIS_SIGNING_STORE_PASSWORD: ${{ secrets.JARVIS_SIGNING_STORE_PASSWORD }}
          JARVIS_SIGNING_KEY_ALIAS: ${{ secrets.JARVIS_SIGNING_KEY_ALIAS }}
          JARVIS_SIGNING_KEY_PASSWORD: ${{ secrets.JARVIS_SIGNING_KEY_PASSWORD }}
        run: bash gradlew --no-daemon assembleRelease
      - name: Check existing Beta credential availability
        id: beta
        if: steps.signing.outputs.configured == 'true'
        env:
          JARVIS_BETA_GEMINI_API_KEY: ${{ secrets.JARVIS_BETA_GEMINI_API_KEY }}
        shell: bash
        run: |
          if [ -n "$JARVIS_BETA_GEMINI_API_KEY" ]; then
            echo 'configured=true' >> "$GITHUB_OUTPUT"
          else
            echo 'configured=false' >> "$GITHUB_OUTPUT"
            echo '::warning::Beta credential is absent. Beta builds/publication are skipped; existing Beta downloads and API behavior remain unchanged.'
            echo 'Beta was NOT built or updated: its existing credential was unavailable.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Compile full Beta from the same source revision
        if: steps.beta.outputs.configured == 'true'
        env:
          JARVIS_BETA_GEMINI_API_KEY: ${{ secrets.JARVIS_BETA_GEMINI_API_KEY }}
          JARVIS_VERSION_CODE: ${{ github.run_number }}
          JARVIS_VERSION_NAME: 3.5.${{ github.run_number }}
          JARVIS_UNIVERSAL_APK: 'true'
          JARVIS_SIGNING_STORE_FILE: ${{ runner.temp }}/jarvis-release.jks
          JARVIS_SIGNING_STORE_PASSWORD: ${{ secrets.JARVIS_SIGNING_STORE_PASSWORD }}
          JARVIS_SIGNING_KEY_ALIAS: ${{ secrets.JARVIS_SIGNING_KEY_ALIAS }}
          JARVIS_SIGNING_KEY_PASSWORD: ${{ secrets.JARVIS_SIGNING_KEY_PASSWORD }}
        run: bash gradlew --no-daemon assembleBeta
      - name: Compile compact bridge for historical raw Beta installs
        if: steps.beta.outputs.configured == 'true'
        env:
          JARVIS_BETA_GEMINI_API_KEY: ${{ secrets.JARVIS_BETA_GEMINI_API_KEY }}
          JARVIS_UNIVERSAL_APK: 'true'
          JARVIS_SIGNING_STORE_FILE: ${{ runner.temp }}/jarvis-release.jks
          JARVIS_SIGNING_STORE_PASSWORD: ${{ secrets.JARVIS_SIGNING_STORE_PASSWORD }}
          JARVIS_SIGNING_KEY_ALIAS: ${{ secrets.JARVIS_SIGNING_KEY_ALIAS }}
          JARVIS_SIGNING_KEY_PASSWORD: ${{ secrets.JARVIS_SIGNING_KEY_PASSWORD }}
        shell: bash
        run: |
          JARVIS_VERSION_CODE=$(( ${{ github.run_number }} - 1 ))
          export JARVIS_VERSION_CODE
          export JARVIS_VERSION_NAME="3.5.$JARVIS_VERSION_CODE"
          bash gradlew --no-daemon assembleBetaBridge
      - name: Verify API configuration isolation and voice packaging
        if: steps.signing.outputs.configured == 'true'
        env:
          JARVIS_BETA_GEMINI_API_KEY: ${{ secrets.JARVIS_BETA_GEMINI_API_KEY }}
          BETA_CONFIGURED: ${{ steps.beta.outputs.configured }}
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/verify_beta_configuration.py --build-config app/build/generated/source/buildConfig/release/com/assistant/core/BuildConfig.java app/build/outputs/apk/release/*.apk
          for apk in app/build/outputs/apk/release/*.apk; do
            python3 scripts/verify_bundled_voice_apk.py "$apk" --absent
          done
          if [ "$BETA_CONFIGURED" = 'true' ]; then
            python3 scripts/verify_beta_configuration.py --beta --build-config app/build/generated/source/buildConfig/beta/com/assistant/core/BuildConfig.java app/build/outputs/apk/beta/*.apk
            python3 scripts/verify_beta_configuration.py --beta --build-config app/build/generated/source/buildConfig/betaBridge/com/assistant/core/BuildConfig.java app/build/outputs/apk/betaBridge/*.apk
            for apk in app/build/outputs/apk/beta/*.apk; do
              python3 scripts/verify_bundled_voice_apk.py "$apk"
            done
            for apk in app/build/outputs/apk/betaBridge/*.apk; do
              python3 scripts/verify_bundled_voice_apk.py "$apk" --absent
            done
          fi
      - name: Stage verified channels against existing signed installations
        if: steps.signing.outputs.configured == 'true'
        env:
          BETA_CONFIGURED: ${{ steps.beta.outputs.configured }}
        shell: bash
        run: |
          set -euo pipefail
          prior="$RUNNER_TEMP/jarvis-prior"
          mkdir -p "$prior/updates"
          curl --fail --location --retry 3 --output "$prior/original.apk" https://raw.githubusercontent.com/muddigger782012/J.A.R.V.I.S.-/main/artifacts/app-debug.apk
          # Read current pointers, including a preceding publisher's commit.
          git fetch origin main
          for channel in jarvis beta; do
            if git cat-file -e "origin/main:updates/$channel.json" 2>/dev/null; then
              git show "origin/main:updates/$channel.json" > "$prior/updates/$channel.json"
            fi
          done
          beta_args=()
          if [ "$BETA_CONFIGURED" = 'true' ]; then
            curl --fail --location --retry 3 --output "$prior/beta-raw.apk" https://raw.githubusercontent.com/muddigger782012/J.A.R.V.I.S.-/main/artifacts/beta.apk
            curl --fail --location --retry 3 --output "$prior/beta-full.apk" https://github.com/muddigger782012/J.A.R.V.I.S.-/releases/download/beta-latest/Beta.apk
            beta_args=(--beta-dir app/build/outputs/apk/beta --bridge-dir app/build/outputs/apk/betaBridge --previous-beta-raw "$prior/beta-raw.apk" --previous-beta-full "$prior/beta-full.apk")
          fi
          python3 scripts/stage_update_channels.py --original-dir app/build/outputs/apk/release --previous-original "$prior/original.apk" --previous-metadata-dir "$prior/updates" --source-commit "$GITHUB_SHA" --version-code '${{ github.run_number }}' --output "$RUNNER_TEMP/jarvis-update-stage" --aapt "$ANDROID_HOME/build-tools/34.0.0/aapt" --apksigner "$ANDROID_HOME/build-tools/34.0.0/apksigner" "${beta_args[@]}"
      - name: Upload verified APK artifact
        if: github.ref == 'refs/heads/main' && steps.signing.outputs.configured == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: Jarvis-release-APK
          path: ${{ runner.temp }}/jarvis-update-stage/releases/jarvis/*.apk
          if-no-files-found: error
      - name: Upload verified Beta APK artifact
        if: github.ref == 'refs/heads/main' && steps.beta.outputs.configured == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: Beta-release-APK
          path: ${{ runner.temp }}/jarvis-update-stage/releases/beta/*.apk
          compression-level: 0
          retention-days: 3
          if-no-files-found: error
      - name: Encrypt compact verified candidate bundle
        if: github.ref == 'refs/heads/codex/separate-update-channels' && steps.signing.outputs.configured == 'true' && steps.beta.outputs.configured == 'true'
        run: python3 scripts/encrypt_candidate.py --stage "$RUNNER_TEMP/jarvis-update-stage" --source-commit "$GITHUB_SHA" --recipient .github/candidate-recipient.pem --output "$RUNNER_TEMP/jarvis-candidate.cms"
      - name: Upload encrypted candidate only
        if: github.ref == 'refs/heads/codex/separate-update-channels' && steps.signing.outputs.configured == 'true' && steps.beta.outputs.configured == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: Jarvis-encrypted-candidate-${{ github.run_number }}
          path: ${{ runner.temp }}/jarvis-candidate.cms
          compression-level: 0
          retention-days: 3
          if-no-files-found: error
      - name: Publish verified channels and preserve legacy updater paths
        if: github.ref == 'refs/heads/main' && steps.signing.outputs.configured == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/publish_update_channels.py --stage "${{ runner.temp }}/jarvis-update-stage" --source-commit "$GITHUB_SHA"
      - name: Remove signing material and plaintext build outputs
        if: always()
        shell: bash
        run: |
          rm -f -- "$RUNNER_TEMP/jarvis-release.jks"
          rm -rf -- "$RUNNER_TEMP/jarvis-update-stage" app/build
