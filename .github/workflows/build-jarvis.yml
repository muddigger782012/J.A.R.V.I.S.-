name: Build Jarvis APK
on:
  push:
    branches: [main]
    paths-ignore:
      - 'artifacts/**'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: jarvis-main-apk-publisher
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Extract Jarvis project ZIP if present
        shell: bash
        run: |
          if ! test -f settings.gradle && ! test -f settings.gradle.kts; then
            if [ -f Jarvis-AI-cloud-build-v3.3.zip ]; then
              mkdir -p /tmp/jarvis-project
              unzip -q Jarvis-AI-cloud-build-v3.3.zip -d /tmp/jarvis-project
              cp -a /tmp/jarvis-project/. .
            fi
          fi
          (test -f settings.gradle || test -f settings.gradle.kts) || { echo 'Jarvis Android source is missing.'; exit 1; }
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: android-actions/setup-android@v4
      - name: Prepare permanent JARVIS signing key
        id: signing
        shell: bash
        env:
          JARVIS_SIGNING_KEY_B64: ${{ secrets.JARVIS_SIGNING_KEY_B64 }}
          JARVIS_SIGNING_STORE_PASSWORD: ${{ secrets.JARVIS_SIGNING_STORE_PASSWORD }}
          JARVIS_SIGNING_KEY_PASSWORD: ${{ secrets.JARVIS_SIGNING_KEY_PASSWORD }}
          JARVIS_SIGNING_KEY_ALIAS: ${{ secrets.JARVIS_SIGNING_KEY_ALIAS }}
        run: |
          if [ -n "$JARVIS_SIGNING_KEY_B64" ] && [ -n "$JARVIS_SIGNING_STORE_PASSWORD" ] && [ -n "$JARVIS_SIGNING_KEY_PASSWORD" ] && [ -n "$JARVIS_SIGNING_KEY_ALIAS" ]; then
            printf '%s' "$JARVIS_SIGNING_KEY_B64" | base64 --decode > "$RUNNER_TEMP/jarvis-release.jks"
            chmod 600 "$RUNNER_TEMP/jarvis-release.jks"
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Permanent signing secrets are not configured; publishing is disabled for this run."
          fi
      - name: Install Android SDK
        run: sdkmanager 'platforms;android-34' 'build-tools;34.0.0'
      - name: Prepare sherpa-onnx Android runtime
        shell: bash
        run: |
          mkdir -p app/libs
          curl -fL --retry 3 -o app/libs/sherpa-onnx-1.13.8.aar \
            https://github.com/k2-fsa/sherpa-onnx/releases/download/v1.13.8/sherpa-onnx-1.13.8.aar
          test -s app/libs/sherpa-onnx-1.13.8.aar
          curl -fL --retry 3 -o /tmp/sherpa-kws.tar.bz2 \
            https://github.com/k2-fsa/sherpa-onnx/releases/download/kws-models/sherpa-onnx-kws-zipformer-gigaspeech-3.3M-2024-01-01.tar.bz2
          mkdir -p app/src/main/assets
          tar -xjf /tmp/sherpa-kws.tar.bz2 -C app/src/main/assets
          KWS_DIR="$(find app/src/main/assets -maxdepth 1 -type d -name 'sherpa-onnx-kws-zipformer-gigaspeech-3.3M-2024-01-01*' | head -n1)"
          test -n "$KWS_DIR"
          if [ "$(basename "$KWS_DIR")" != "sherpa-onnx-kws-zipformer-gigaspeech-3.3M-2024-01-01" ]; then
            rm -rf app/src/main/assets/sherpa-onnx-kws-zipformer-gigaspeech-3.3M-2024-01-01
            mv "$KWS_DIR" app/src/main/assets/sherpa-onnx-kws-zipformer-gigaspeech-3.3M-2024-01-01
          fi
          find app/src/main/assets/sherpa-onnx-kws-zipformer-gigaspeech-3.3M-2024-01-01 -maxdepth 1 -type f -printf '%f\n'
          test -f app/src/main/assets/sherpa-onnx-kws-zipformer-gigaspeech-3.3M-2024-01-01/tokens.txt
          # Package FP32 models to isolate the first-decode INT8 stall.
          ls -lh app/src/main/assets/sherpa-onnx-kws-zipformer-gigaspeech-3.3M-2024-01-01/*onnx
          python3 -m pip install --quiet sentencepiece sherpa-onnx==1.13.8 numpy
          python3 - <<'PY'
          from pathlib import Path
          import sentencepiece as spm
          d = Path("app/src/main/assets/sherpa-onnx-kws-zipformer-gigaspeech-3.3M-2024-01-01")
          model = d / "bpe.model"
          if not model.is_file():
              raise SystemExit("English KWS BPE tokenizer is missing: " + str(model))
          sp = spm.SentencePieceProcessor(model_file=str(model))
          pieces = sp.encode("HEY JARVIS", out_type=str)
          valid = {line.rsplit(" ", 1)[0] for line in (d / "tokens.txt").read_text().splitlines() if line.strip()}
          if not pieces or any(piece not in valid for piece in pieces):
              raise SystemExit("HEY JARVIS cannot be represented by the model's token vocabulary: " + repr(pieces))
          keyword = " ".join(pieces) + " @HEY_JARVIS\n"
          (d / "jarvis-keywords.txt").write_text(keyword)
          print("Generated Sherpa wake tokens:", keyword.strip())
          for prefix in ("encoder-", "decoder-", "joiner-"):
              if not any(p.name.startswith(prefix) and p.name.endswith(".onnx") for p in d.iterdir()):
                  raise SystemExit("Missing " + prefix + " ONNX model")
          PY
      - name: Verify dedicated male models and embed download metadata
        run: |
          timeout 600s python3 scripts/prepare_neural_voice.py --directory /tmp/jarvis-kokoro --metadata app/src/main/assets/neural-voice-pack.json --smoke --bundle app/src/beta/assets/voice-packs/kokoro.tar.bz2
      - name: Stamp the bundled and public intelligence progress report
        env:
          JARVIS_PLAN_BUILD: ${{ github.run_number }}
        run: |
          python3 - <<'PYPLAN'
          import json, os
          from pathlib import Path
          from datetime import datetime
          from zoneinfo import ZoneInfo
          source = Path('docs/intelligence-plan.json')
          plan = json.loads(source.read_text())
          build = int(os.environ['JARVIS_PLAN_BUILD'])
          plan['revision'] = max(int(plan['revision']) + 1, build)
          plan['throughVersion'] = '3.5.' + str(build)
          plan['updated'] = datetime.now(ZoneInfo('America/New_York')).date().isoformat()
          text = json.dumps(plan, ensure_ascii=False, indent=2) + '\n'
          source.write_text(text)
          Path('app/src/main/assets/intelligence-plan.json').write_text(text)
          PYPLAN
      - name: Test bundled APK integrity checks
        run: python3 -m unittest discover -s scripts/tests -p 'test_*.py'
      - name: Verify native keyword decoder and run unit tests
        run: |
          timeout 60s python3 scripts/wake_decoder_smoke.py app/src/main/assets/sherpa-onnx-kws-zipformer-gigaspeech-3.3M-2024-01-01
          chmod +x ./gradlew
          ./gradlew --no-daemon testDebugUnitTest
      - name: Compile versioned release APK
        if: steps.signing.outputs.configured == 'true'
        env:
          JARVIS_VERSION_CODE: ${{ github.run_number }}
          JARVIS_VERSION_NAME: 3.5.${{ github.run_number }}
          JARVIS_SIGNING_STORE_FILE: ${{ runner.temp }}/jarvis-release.jks
          JARVIS_SIGNING_STORE_PASSWORD: ${{ secrets.JARVIS_SIGNING_STORE_PASSWORD }}
          JARVIS_SIGNING_KEY_ALIAS: ${{ secrets.JARVIS_SIGNING_KEY_ALIAS }}
          JARVIS_SIGNING_KEY_PASSWORD: ${{ secrets.JARVIS_SIGNING_KEY_PASSWORD }}
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon assembleRelease
      - name: Compile Beta from the same source revision
        if: steps.signing.outputs.configured == 'true'
        env:
          JARVIS_BETA_GEMINI_API_KEY: ${{ secrets.JARVIS_BETA_GEMINI_API_KEY }}
          JARVIS_VERSION_CODE: ${{ github.run_number }}
          JARVIS_VERSION_NAME: 3.5.${{ github.run_number }}
          JARVIS_SIGNING_STORE_FILE: ${{ runner.temp }}/jarvis-release.jks
          JARVIS_SIGNING_STORE_PASSWORD: ${{ secrets.JARVIS_SIGNING_STORE_PASSWORD }}
          JARVIS_SIGNING_KEY_ALIAS: ${{ secrets.JARVIS_SIGNING_KEY_ALIAS }}
          JARVIS_SIGNING_KEY_PASSWORD: ${{ secrets.JARVIS_SIGNING_KEY_PASSWORD }}
        run: |
          if [ -z "$JARVIS_BETA_GEMINI_API_KEY" ]; then
            echo '::warning::Beta is not configured. Add repository secret JARVIS_BETA_GEMINI_API_KEY to enable its automatic builds.'
            exit 0
          fi
          ./gradlew --no-daemon assembleBeta
          AAPT="$ANDROID_HOME/build-tools/34.0.0/aapt"
          APKSIGNER="$ANDROID_HOME/build-tools/34.0.0/apksigner"
          found=0
          for APK in app/build/outputs/apk/beta/*.apk; do
            found=1
            "$APKSIGNER" verify "$APK"
            "$AAPT" dump badging "$APK" | head -n 1 | grep -q "name='com.assistant.core.beta'"
            "$AAPT" dump badging "$APK" | head -n 1 | grep -q "versionCode='${{ github.run_number }}'"
            "$AAPT" dump badging "$APK" | grep -q "application-label:'Beta'"
            python3 scripts/verify_bundled_voice_apk.py "$APK"
          done
          test "$found" -eq 1
      - name: Verify APK identity and signing
        if: steps.signing.outputs.configured == 'true'
        shell: bash
        run: |
          AAPT="$ANDROID_HOME/build-tools/34.0.0/aapt"
          APKSIGNER="$ANDROID_HOME/build-tools/34.0.0/apksigner"
          found=0
          for APK in app/build/outputs/apk/release/*.apk; do
            found=1
            echo "Verifying $APK ($(du -h "$APK" | cut -f1))"
            "$AAPT" dump badging "$APK" | head -n 1
            "$APKSIGNER" verify --print-certs "$APK"
            python3 scripts/verify_bundled_voice_apk.py "$APK" --absent
            "$AAPT" dump badging "$APK" | head -n 1 | grep -q "name='com.assistant.core'"
            "$AAPT" dump badging "$APK" | head -n 1 | grep -q "versionCode='${{ github.run_number }}'"
          done
          test "$found" -eq 1

      - name: Upload APK artifact
        if: steps.signing.outputs.configured == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: Jarvis-release-APK
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
      - name: Upload Beta APK artifact
        if: steps.signing.outputs.configured == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: Beta-release-APK
          path: app/build/outputs/apk/beta/*arm64-v8a*.apk
          compression-level: 0
          retention-days: 3
          if-no-files-found: ignore
      - name: Publish complete Beta APK as a release download
        if: steps.signing.outputs.configured == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          BETA_APK="$(find app/build/outputs/apk/beta -maxdepth 1 -name '*arm64-v8a*.apk' -print -quit 2>/dev/null || true)"
          if [ -z "$BETA_APK" ]; then
            echo 'Beta was not configured for this run.'
            exit 0
          fi
          cp "$BETA_APK" "$RUNNER_TEMP/Beta.apk"
          if ! gh release view beta-latest --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create beta-latest --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title 'J.A.R.V.I.S. Beta' --prerelease --notes 'Complete Beta with bundled offline voices and preconfigured AI.'
          fi
          gh release upload beta-latest "$RUNNER_TEMP/Beta.apk" --repo "$GITHUB_REPOSITORY" --clobber
          gh release edit beta-latest --repo "$GITHUB_REPOSITORY" --notes "Signed Beta from commit $GITHUB_SHA, version 3.5.${{ github.run_number }}-beta. Includes the verified Kokoro voice pack and first-launch setup."
      - name: Publish ARM64 APK for the normal app updater
        if: steps.signing.outputs.configured == 'true'
        shell: bash
        run: |
          APK="$(find app/build/outputs/apk/release -maxdepth 1 -name '*arm64-v8a*.apk' -print -quit)"
          test -n "$APK"
          cp "$APK" /tmp/jarvis-arm64-latest.apk
          git fetch origin main
          git reset --hard origin/main
          mkdir -p artifacts
          cp /tmp/jarvis-arm64-latest.apk artifacts/app-debug.apk
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add artifacts/app-debug.apk docs/intelligence-plan.json app/src/main/assets/intelligence-plan.json
          if git diff --cached --quiet; then
            echo "Updater APK is already current."
          else
            git commit -m "Publish JARVIS updater APK [skip ci]"
            git push origin HEAD:main
          fi
