name: Build Jarvis APK
on:
  push:
    branches: [main]
    paths-ignore:
      - 'artifacts/**'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: jarvis-main-apk-publisher
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Extract Jarvis project ZIP if present
        shell: bash
        run: |
          if ! test -f settings.gradle && ! test -f settings.gradle.kts; then
            if [ -f Jarvis-AI-cloud-build-v3.3.zip ]; then
              mkdir -p /tmp/jarvis-project
              unzip -q Jarvis-AI-cloud-build-v3.3.zip -d /tmp/jarvis-project
              cp -a /tmp/jarvis-project/. .
            fi
          fi
          (test -f settings.gradle || test -f settings.gradle.kts) || { echo 'Jarvis Android source is missing.'; exit 1; }
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: android-actions/setup-android@v4
      - name: Prepare permanent JARVIS signing key
        id: signing
        shell: bash
        env:
          JARVIS_SIGNING_KEY_B64: ${{ secrets.JARVIS_SIGNING_KEY_B64 }}
          JARVIS_SIGNING_STORE_PASSWORD: ${{ secrets.JARVIS_SIGNING_STORE_PASSWORD }}
          JARVIS_SIGNING_KEY_PASSWORD: ${{ secrets.JARVIS_SIGNING_KEY_PASSWORD }}
          JARVIS_SIGNING_KEY_ALIAS: ${{ secrets.JARVIS_SIGNING_KEY_ALIAS }}
        run: |
          if [ -n "$JARVIS_SIGNING_KEY_B64" ] && [ -n "$JARVIS_SIGNING_STORE_PASSWORD" ] && [ -n "$JARVIS_SIGNING_KEY_PASSWORD" ] && [ -n "$JARVIS_SIGNING_KEY_ALIAS" ]; then
            printf '%s' "$JARVIS_SIGNING_KEY_B64" | base64 --decode > "$RUNNER_TEMP/jarvis-release.jks"
            chmod 600 "$RUNNER_TEMP/jarvis-release.jks"
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Permanent signing secrets are not configured; publishing is disabled for this run."
          fi
      - name: Install Android SDK
        run: sdkmanager 'platforms;android-34' 'build-tools;34.0.0'
      - name: Prepare sherpa-onnx Android runtime
        shell: bash
        run: |
          mkdir -p app/libs
          curl -fL --retry 3 -o app/libs/sherpa-onnx-1.13.8.aar \
            https://github.com/k2-fsa/sherpa-onnx/releases/download/v1.13.8/sherpa-onnx-1.13.8.aar
          test -s app/libs/sherpa-onnx-1.13.8.aar
          curl -fL --retry 3 -o /tmp/sherpa-kws.tar.bz2 \
            https://github.com/k2-fsa/sherpa-onnx/releases/download/kws-models/sherpa-onnx-kws-zipformer-gigaspeech-3.3M-2024-01-01-mobile.tar.bz2
          mkdir -p app/src/main/assets
          tar -xjf /tmp/sherpa-kws.tar.bz2 -C app/src/main/assets
          KWS_DIR="$(find app/src/main/assets -maxdepth 1 -type d -name 'sherpa-onnx-kws-zipformer-gigaspeech-3.3M-2024-01-01*' | head -n1)"
          test -n "$KWS_DIR"
          if [ "$(basename "$KWS_DIR")" != "sherpa-onnx-kws-zipformer-gigaspeech-3.3M-2024-01-01" ]; then
            rm -rf app/src/main/assets/sherpa-onnx-kws-zipformer-gigaspeech-3.3M-2024-01-01
            mv "$KWS_DIR" app/src/main/assets/sherpa-onnx-kws-zipformer-gigaspeech-3.3M-2024-01-01
          fi
          find app/src/main/assets/sherpa-onnx-kws-zipformer-gigaspeech-3.3M-2024-01-01 -maxdepth 1 -type f -printf '%f\n'
          test -f app/src/main/assets/sherpa-onnx-kws-zipformer-gigaspeech-3.3M-2024-01-01/tokens.txt
      - name: Compile versioned release APK
        if: steps.signing.outputs.configured == 'true'
        env:
          JARVIS_VERSION_CODE: ${{ github.run_number }}
          JARVIS_VERSION_NAME: 3.5.${{ github.run_number }}
          JARVIS_SIGNING_STORE_FILE: ${{ runner.temp }}/jarvis-release.jks
          JARVIS_SIGNING_STORE_PASSWORD: ${{ secrets.JARVIS_SIGNING_STORE_PASSWORD }}
          JARVIS_SIGNING_KEY_ALIAS: ${{ secrets.JARVIS_SIGNING_KEY_ALIAS }}
          JARVIS_SIGNING_KEY_PASSWORD: ${{ secrets.JARVIS_SIGNING_KEY_PASSWORD }}
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon assembleRelease
      - name: Verify APK identity and signing
        if: steps.signing.outputs.configured == 'true'
        shell: bash
        run: |
          APK="app/build/outputs/apk/release/app-release.apk"
          AAPT="$ANDROID_HOME/build-tools/34.0.0/aapt"
          APKSIGNER="$ANDROID_HOME/build-tools/34.0.0/apksigner"
          "$AAPT" dump badging "$APK" | head -n 1
          "$APKSIGNER" verify --print-certs "$APK"
          "$AAPT" dump badging "$APK" | head -n 1 | grep -q "name='com.assistant.core'"
          "$AAPT" dump badging "$APK" | head -n 1 | grep -q "versionCode='${{ github.run_number }}'"

      - name: Upload APK artifact
        if: steps.signing.outputs.configured == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: Jarvis-release-APK
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
      - name: Keep APK in workflow artifact storage
        run: |
          echo "APK is larger than GitHub's 100 MB normal repository file limit."
          echo "The signed APK is available from the Jarvis-release-APK workflow artifact."
