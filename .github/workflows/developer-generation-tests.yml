name: Developer generation regression tests
on:
  pull_request:
    paths:
      - 'developer/**'
      - '.github/workflows/developer-generation-tests.yml'
  push:
    branches:
      - fix/developer-generation-state-integrity
    paths:
      - 'developer/**'
      - '.github/workflows/developer-generation-tests.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      # GitHub's Ubuntu runner already provides ANDROID_HOME and command-line tools.
      # setup-android@v3 fails on this runner trying to install nonexistent package 'tools'.
      - name: Verify preinstalled Android SDK
        run: test -d "$ANDROID_HOME/platforms" && test -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
      - uses: gradle/actions/setup-gradle@v4
      - name: Run Developer generation regression tests
        run: ./gradlew -PjarvisDeveloper=true :developer:testDebugUnitTest --tests 'com.jarvis.developer.ProjectGenerationStoreConcurrencyTest' --stacktrace --no-daemon
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: developer-generation-test-results
          path: developer/build/reports/tests/
          if-no-files-found: warn

  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Verify preinstalled Android SDK
        run: test -d "$ANDROID_HOME/platforms" && test -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
      - uses: gradle/actions/setup-gradle@v4
      - name: Assemble Developer debug APK
        run: ./gradlew -PjarvisDeveloper=true :developer:assembleDebug --stacktrace --no-daemon
      - name: Verify APK exists
        run: test -s developer/build/outputs/apk/debug/developer-debug.apk
      - name: Upload installable Developer APK
        uses: actions/upload-artifact@v4
        with:
          name: Jarvis-Developer-debug-apk
          path: developer/build/outputs/apk/debug/developer-debug.apk
          if-no-files-found: error
          retention-days: 30
