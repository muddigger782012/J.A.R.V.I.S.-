name: Developer generation regression tests
on:
  pull_request:
    paths:
      - 'developer/**'
      - '.github/workflows/developer-generation-tests.yml'
  push:
    branches:
      - integration/developer-production-reconcile
    paths:
      - 'developer/**'
      - '.github/workflows/developer-generation-tests.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  # Windows desktop compatibility is a protected contract. The sidecar is
  # platform-neutral; Android remains only a client. This verifies the real
  # Python HTTPS/CLI adapter through a Node-style interpreter entry on Windows.
  rea-bridge-windows:
    runs-on: windows-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify Windows-compatible REA bridge protocol
        run: python -m unittest discover -s developer/tools -p 'rea_bridge_test.py' -v
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      # GitHub's Ubuntu runner already provides ANDROID_HOME and command-line tools.
      # setup-android@v3 fails on this runner trying to install nonexistent package 'tools'.
      - name: Verify preinstalled Android SDK
        run: test -d "$ANDROID_HOME/platforms" && test -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
      - uses: gradle/actions/setup-gradle@v4
      - name: Verify bounded candidate evaluator and JUnit evidence contracts
        run: python3 -m unittest discover -s developer/tools -p 'candidate_audit_test.py' -v
      - name: Validate isolated REA APK bridge protocol and safety
        run: python3 -m unittest discover -s developer/tools -p 'rea_bridge_test.py' -v
      - name: Run Developer generation regression tests
        run: ./gradlew -PjarvisDeveloper=true :developer:testDebugUnitTest --stacktrace --no-daemon
      - name: Verify actual Developer JUnit evidence before canonical integration
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import sys
          sys.path.insert(0, 'developer/tools')
          from candidate_audit import read_junit_counts
          totals = read_junit_counts(Path('.'))
          assert totals['tests'] > 0 and not any(totals[key] for key in ('failures', 'errors', 'skipped')), 'Real Developer test inventory is not fully green'
          print('JARVIS_REAL_JUNIT_COUNTS=' + str(totals))
          PY
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: developer-generation-test-results
          path: developer/build/reports/tests/
          if-no-files-found: warn

  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Verify preinstalled Android SDK
        run: test -d "$ANDROID_HOME/platforms" && test -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
      - uses: gradle/actions/setup-gradle@v4
      - name: Assemble Developer debug APK with dependency retry
        shell: bash
        run: |
          set -o pipefail
          for attempt in 1 2 3; do
            echo "APK build attempt $attempt of 3"
            if ./gradlew -PjarvisDeveloper=true :developer:assembleDebug --stacktrace --no-daemon --refresh-dependencies; then
              exit 0
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "::error::Developer APK assembly failed after three attempts; inspect dependency resolution logs"
              exit 1
            fi
            sleep $((attempt * 20))
          done
      - name: Verify APK exists
        run: test -s developer/build/outputs/apk/debug/developer-debug.apk
      - name: Upload installable Developer APK
        uses: actions/upload-artifact@v4
        with:
          name: Jarvis-Developer-debug-apk
          path: developer/build/outputs/apk/debug/developer-debug.apk
          if-no-files-found: error
          retention-days: 30
