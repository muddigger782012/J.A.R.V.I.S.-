name: Connection Manager Debug APK
on:
  workflow_dispatch:
  push:
    branches:
      - feature/connection-manager
    paths:
      - 'connection-manager/**'
      - 'settings.gradle'
      - '.github/workflows/connection-manager.yml'
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Verify Android SDK
        run: test -d "$ANDROID_HOME/platforms" && echo "Android SDK available"
      - uses: gradle/actions/setup-gradle@v4
      - name: Build Connection Manager
        run: bash ./gradlew :connection-manager:assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: jarvis-connection-manager-debug
          path: connection-manager/build/outputs/apk/debug/*.apk
          if-no-files-found: error
