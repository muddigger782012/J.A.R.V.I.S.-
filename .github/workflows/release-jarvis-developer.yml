name: Publish Jarvis Developer update
on:
  push:
    branches: [feature/jarvis-developer]
    paths:
      - 'developer/**'
      - 'docs/development-plans/developer-build-request.md'
      - 'settings.gradle'
      - 'build.gradle'
      - '.github/workflows/release-jarvis-developer.yml'
  workflow_dispatch:
    inputs:
      defer_recovery:
        description: 'Owner-approved publication with recovery verification deferred'
        required: false
        type: boolean
        default: false
      recovery_sha:
        description: 'Optional previously verified Developer commit SHA to rebuild as a newer APK'
        required: false
        type: string
      recover_previous:
        description: 'Rebuild the previous published Developer source (no SHA needed)'
        required: false
        type: boolean
        default: false
permissions:
  contents: write
concurrency:
  group: developer-release-channel
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve approved recovery source
        id: recovery
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
          RECOVERY_SHA: ${{ inputs.recovery_sha }}
          RECOVER_PREVIOUS: ${{ inputs.recover_previous }}
        run: |
          if [ "$RECOVER_PREVIOUS" = "true" ] && [ -n "$RECOVERY_SHA" ]; then
            echo "::error::Select either recover_previous or recovery_sha, not both."
            exit 1
          fi
          if [ "$RECOVER_PREVIOUS" = "true" ]; then
            RECOVERY_SHA=$(gh release view developer-previous --repo "$GITHUB_REPOSITORY" --json targetCommitish --jq .targetCommitish)
          fi
          if [ -n "$RECOVERY_SHA" ]; then
            [[ "$RECOVERY_SHA" =~ ^[0-9a-fA-F]{40}$ ]] || { echo 'Invalid recovery SHA'; exit 1; }
          fi
          echo "sha=$RECOVERY_SHA" >> "$GITHUB_OUTPUT"
      - name: Record selected Developer source
        env:
          SOURCE_SHA: ${{ steps.recovery.outputs.sha || github.sha }}
        run: |
          echo "Developer source commit: $SOURCE_SHA"
          echo "Workflow run: $GITHUB_RUN_NUMBER"
          echo "Recovery selected: ${{ steps.recovery.outputs.sha != '' }}"
          {
            echo "### Developer build provenance"
            echo "- Source: \`$SOURCE_SHA\`"
            echo "- Run: \`$GITHUB_RUN_NUMBER\`"
            echo "- Recovery: \`${{ steps.recovery.outputs.sha != '' }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Validate recovery source
        env:
          RECOVERY_SHA: ${{ steps.recovery.outputs.sha }}
        run: |
          if [ -n "$RECOVERY_SHA" ]; then
            [[ "$RECOVERY_SHA" =~ ^[0-9a-fA-F]{40}$ ]] || { echo 'Invalid recovery SHA'; exit 1; }
          fi
      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.recovery.outputs.sha || github.sha }}
          fetch-depth: 0
      - name: Verify recovery SHA belongs to Developer history
        if: github.event_name == 'workflow_dispatch' && steps.recovery.outputs.sha != ''
        env:
          RECOVERY_SHA: ${{ steps.recovery.outputs.sha }}
        run: |
          git fetch origin feature/jarvis-developer
          git cat-file -e "${RECOVERY_SHA}^{commit}" || { echo 'Recovery commit not found'; exit 1; }
          git merge-base --is-ancestor "$RECOVERY_SHA" origin/feature/jarvis-developer || {
            echo 'Recovery commit must be an ancestor of the isolated Developer branch.'
            exit 1
          }
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - name: Install Android SDK build tools
        run: sdkmanager 'platforms;android-34' 'build-tools;34.0.0'
      - name: Restore permanent signing key
        env:
          KEY_B64: ${{ secrets.JARVIS_SIGNING_KEY_B64 }}
          STORE_PASS: ${{ secrets.JARVIS_SIGNING_STORE_PASSWORD }}
          KEY_PASS: ${{ secrets.JARVIS_SIGNING_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.JARVIS_SIGNING_KEY_ALIAS }}
        run: |
          test -n "$KEY_B64" && test -n "$STORE_PASS" && test -n "$KEY_PASS" && test -n "$KEY_ALIAS"
          printf '%s' "$KEY_B64" | base64 -d > "$RUNNER_TEMP/developer-release.jks"
          chmod 600 "$RUNNER_TEMP/developer-release.jks"
      - name: Prepare transparent reactor icon and header artwork
        run: |
          python3 -m pip install --quiet Pillow
          python3 developer/tools/transparent_reactor.py
      - name: Compile signed Developer release
        env:
          DEVELOPER_VERSION_CODE: ${{ github.run_number }}
          DEVELOPER_VERSION_NAME: 0.1.${{ github.run_number }}
          JARVIS_SIGNING_STORE_FILE: ${{ runner.temp }}/developer-release.jks
          JARVIS_SIGNING_STORE_PASSWORD: ${{ secrets.JARVIS_SIGNING_STORE_PASSWORD }}
          JARVIS_SIGNING_KEY_ALIAS: ${{ secrets.JARVIS_SIGNING_KEY_ALIAS }}
          JARVIS_SIGNING_KEY_PASSWORD: ${{ secrets.JARVIS_SIGNING_KEY_PASSWORD }}
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon :developer:assembleRelease
          APK=developer/build/outputs/apk/release/developer-release.apk
          test -s "$APK"
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify "$APK"
          "$ANDROID_HOME/build-tools/34.0.0/aapt" dump badging "$APK" | head -1 | grep -q "name='com.jarvis.developer'"
          cp "$APK" "$RUNNER_TEMP/Jarvis-Developer.apk"
      - name: Upload signed release candidate artifact
        uses: actions/upload-artifact@v4
        with:
          name: Jarvis-Developer-signed-release-candidate
          path: ${{ runner.temp }}/Jarvis-Developer.apk
          if-no-files-found: error
      - name: Verify release write access
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "Release promotion requires a token with repository Contents: read/write."
          echo "If GitHub defaults the workflow token to read-only, configure JARVIS_DEVELOPER_RELEASE_TOKEN as a fine-grained repository token with Contents: read/write."
          gh api "repos/$GITHUB_REPOSITORY/releases?per_page=1" >/dev/null || {
            echo "::error::Cannot access releases. Check JARVIS_DEVELOPER_RELEASE_TOKEN and repository Actions permissions."
            exit 1
          }
      - name: Record signed APK checksum
        run: |
          SHA256=$(sha256sum "$RUNNER_TEMP/Jarvis-Developer.apk" | cut -d ' ' -f 1)
          echo "Signed APK SHA-256: $SHA256"
          {
            echo "### Signed APK integrity"
            echo "- SHA-256: \`$SHA256\`"
            echo "- Artifact: \`Jarvis-Developer-signed-release-candidate\`"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Validate previous release recovery metadata
        if: github.event_name == 'workflow_dispatch' && !inputs.defer_recovery
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view developer-latest >/dev/null 2>&1; then
            PREVIOUS_SOURCE=$(gh release view developer-latest --json targetCommitish --jq .targetCommitish)
            if ! [[ "$PREVIOUS_SOURCE" =~ ^[0-9a-fA-F]{40}$ ]]; then
              echo "::error::Previous release does not record a full immutable source commit SHA. Refusing promotion to protect rollback."
              exit 1
            fi
            git cat-file -e "${PREVIOUS_SOURCE}^{commit}" || {
              echo "::error::Previous release source commit is unavailable."
              exit 1
            }
          fi
      - name: Preserve previous signed Developer release
        if: github.event_name == 'workflow_dispatch' && !inputs.defer_recovery
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view developer-latest >/dev/null 2>&1; then
            PREVIOUS_SOURCE=$(gh release view developer-latest --json targetCommitish --jq .targetCommitish)
            test -n "$PREVIOUS_SOURCE"
            mkdir -p "$RUNNER_TEMP/developer-previous"
            if gh release download developer-latest -p Jarvis-Developer.apk -D "$RUNNER_TEMP/developer-previous"; then
              if ! gh release view developer-previous >/dev/null 2>&1; then
                gh release create developer-previous --target "$PREVIOUS_SOURCE" --prerelease --title 'Jarvis Developer previous signed APK' --notes 'Backup only. Android version downgrade is normally blocked; use a recovery rebuild instead.'
              fi
              gh release upload developer-previous "$RUNNER_TEMP/developer-previous/Jarvis-Developer.apk" --clobber
              gh release edit developer-previous --target "$PREVIOUS_SOURCE" --notes "Previous published Developer source commit: $PREVIOUS_SOURCE. Rebuild this SHA via the workflow recovery_sha input; do not install an APK downgrade."
            else
              echo 'Could not preserve previous APK; refusing to replace update channel.'
              exit 1
            fi
          fi
      - name: Verify previous backup matches prior release
        if: github.event_name == 'workflow_dispatch' && !inputs.defer_recovery
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view developer-latest >/dev/null 2>&1; then
            mkdir -p "$RUNNER_TEMP/developer-backup-check"
            gh release download developer-previous -p Jarvis-Developer.apk -D "$RUNNER_TEMP/developer-backup-check"
            cmp "$RUNNER_TEMP/developer-previous/Jarvis-Developer.apk" "$RUNNER_TEMP/developer-backup-check/Jarvis-Developer.apk" || {
              echo "::error::Previous release backup does not match the APK being replaced."
              exit 1
            }
            echo "Previous signed Developer APK backup verified."
          fi
      - name: Publish isolated prerelease update
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view developer-latest >/dev/null 2>&1; then
            gh release create developer-latest --target "${{ steps.recovery.outputs.sha || github.sha }}" --prerelease --title "Jarvis Developer 0.1.${{ github.run_number }}" --notes "Independent Developer signed APK"
          fi
          gh release upload developer-latest "$RUNNER_TEMP/Jarvis-Developer.apk" --clobber
          gh release edit developer-latest --target "${{ steps.recovery.outputs.sha || github.sha }}" --title "Jarvis Developer 0.1.${{ github.run_number }}" --notes "Developer source ${{ steps.recovery.outputs.sha || github.sha }}. Version 0.1.${{ github.run_number }}. Recovery build: ${{ steps.recovery.outputs.sha != '' }}. Recovery verification deferred by owner: ${{ inputs.defer_recovery }}."
