name: Publish Jarvis Developer update
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish:
    if: github.ref == 'refs/heads/feature/jarvis-developer'
    runs-on: ubuntu-latest
    environment: developer-release
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - name: Restore permanent signing key
        env:
          KEY_B64: ${{ secrets.JARVIS_SIGNING_KEY_B64 }}
          STORE_PASS: ${{ secrets.JARVIS_SIGNING_STORE_PASSWORD }}
          KEY_PASS: ${{ secrets.JARVIS_SIGNING_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.JARVIS_SIGNING_KEY_ALIAS }}
        run: |
          test -n "$KEY_B64" && test -n "$STORE_PASS" && test -n "$KEY_PASS" && test -n "$KEY_ALIAS"
          printf '%s' "$KEY_B64" | base64 -d > "$RUNNER_TEMP/developer-release.jks"
          chmod 600 "$RUNNER_TEMP/developer-release.jks"
      - name: Compile signed Developer release
        env:
          DEVELOPER_VERSION_CODE: ${{ github.run_number }}
          DEVELOPER_VERSION_NAME: 0.1.${{ github.run_number }}
          JARVIS_SIGNING_STORE_FILE: ${{ runner.temp }}/developer-release.jks
          JARVIS_SIGNING_STORE_PASSWORD: ${{ secrets.JARVIS_SIGNING_STORE_PASSWORD }}
          JARVIS_SIGNING_KEY_ALIAS: ${{ secrets.JARVIS_SIGNING_KEY_ALIAS }}
          JARVIS_SIGNING_KEY_PASSWORD: ${{ secrets.JARVIS_SIGNING_KEY_PASSWORD }}
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon :developer:assembleRelease
          APK=developer/build/outputs/apk/release/developer-release.apk
          test -s "$APK"
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify "$APK"
          "$ANDROID_HOME/build-tools/34.0.0/aapt" dump badging "$APK" | head -1 | grep -q "name='com.jarvis.developer'"
          cp "$APK" "$RUNNER_TEMP/Jarvis-Developer.apk"
      - name: Publish isolated prerelease update
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view developer-latest >/dev/null 2>&1; then
            gh release create developer-latest --target "$GITHUB_SHA" --prerelease --title "Jarvis Developer 0.1.${{ github.run_number }}" --notes "Independent Developer signed APK"
          fi
          gh release upload developer-latest "$RUNNER_TEMP/Jarvis-Developer.apk" --clobber
          gh release edit developer-latest --title "Jarvis Developer 0.1.${{ github.run_number }}" --notes "Developer release from $GITHUB_SHA. Version 0.1.${{ github.run_number }}."
