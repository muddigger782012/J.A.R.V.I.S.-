name: Updater channel and upgrade checks

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: updater-upgrade-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  updater-upgrade:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: android-actions/setup-android@v4
      - name: Prepare Android SDK and existing native runtime
        run: |
          sdkmanager 'platforms;android-34' 'build-tools;34.0.0'
          mkdir -p app/libs
          curl --fail --location --retry 3 --retry-all-errors \
            --output app/libs/sherpa-onnx-1.13.8.aar \
            https://github.com/k2-fsa/sherpa-onnx/releases/download/v1.13.8/sherpa-onnx-1.13.8.aar
          unzip -tq app/libs/sherpa-onnx-1.13.8.aar
      - name: Build updater and API configuration fixtures without production secrets
        run: timeout 900s bash scripts/updater_android_regression.sh --prepare
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Verify signed archives and simulated main and Beta upgrades
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: |
            bash scripts/updater_android_regression.sh --run
            bash scripts/ai_connection_android_regression.sh --run
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: updater-regression-report
          path: app/build/updater-regression/reports/**
          if-no-files-found: warn
