name: Developer 24 requirement evidence audit
on:
  push:
    paths:
      - 'developer/**'
      - 'settings.gradle'
      - 'tools/developer-requirements-audit.py'
      - '.github/workflows/developer-requirements-audit.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  evidence:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Evaluate all 24 requirements
        run: python tools/developer-requirements-audit.py
      - uses: actions/upload-artifact@v4
        with:
          name: developer-24-requirement-evidence
          path: developer-requirements-evidence.json
