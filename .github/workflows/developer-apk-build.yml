name: Developer APK build
on:
  workflow_dispatch:
  push:
    branches:
      - fix/developer-generation-state-integrity
    paths:
      - 'developer/**'
      - 'integration/**'
      - '.github/workflows/developer-apk-build.yml'
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build installable Developer debug APK
        run: ./gradlew -PjarvisDeveloper=true :developer:assembleDebug --stacktrace
      - name: Verify APK exists
        run: test -s developer/build/outputs/apk/debug/developer-debug.apk
      - name: Publish downloadable debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Jarvis-Developer-debug-apk
          path: developer/build/outputs/apk/debug/developer-debug.apk
          if-no-files-found: error
          retention-days: 30
