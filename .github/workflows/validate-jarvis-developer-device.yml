name: Validate Jarvis Developer on disposable Android emulators
# Creating an approved-device branch is the installation action. Do not create
# that ref until the owner has approved the reviewed source and emulator scope.
# Ordinary Developer/task pushes only compile tests and run fake host contracts.
# This version additionally changes disposable display/font/night/rotation settings
# and kills only the fixed background Developer process to verify task restoration.
on:
  push:
    branches: ['feature/jarvis-developer-device-approved/**']
permissions:
  contents: read
jobs:
  device-validation:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/heads/feature/jarvis-developer-device-approved/')
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        api: [28, 34]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - name: Enable KVM for the disposable emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Build and run bounded Developer device checks
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        with:
          api-level: ${{ matrix.api }}
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          emulator-options: -no-window -no-snapshot -noaudio -no-boot-anim -camera-back none
          script: |
            chmod +x ./gradlew
            ./gradlew --no-daemon :developer:connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=com.jarvis.developer.DeveloperDeviceValidationTest
            python3 developer/tools/device_validation.py --serial emulator-5554 --source-sha "${{ github.sha }}" --output-directory "/tmp/jarvis-developer-native-api-${{ matrix.api }}"
      - name: Retain native device evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Jarvis-Developer-device-results-api-${{ matrix.api }}
          path: |
            developer/build/outputs/androidTest-results/connected/
            developer/build/reports/androidTests/connected/
            /tmp/jarvis-developer-native-api-${{ matrix.api }}/
          if-no-files-found: warn
          retention-days: 14
