name: Build Jarvis Developer (isolated)
on:
  workflow_dispatch:
  push:
    branches: [feature/jarvis-developer, 'feature/jarvis-developer-task/**', 'fix/developer-gemini-diagnostics-135']
    paths:
      - 'developer/**'
      - 'settings.gradle'
      - 'build.gradle'
      - '.github/workflows/build-jarvis-developer.yml'
      - '.github/workflows/local-knowledge-checks.yml'
      - 'scripts/ui_layout_smoke.py'
      - 'scripts/job_apk_evidence.py'
      - 'scripts/tests/test_job_apk_evidence.py'
permissions:
  contents: read
jobs:
  personal-repair-android:
    needs: developer-debug
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/download-artifact@v4
        with:
          name: Jarvis-Developer-debug-APK
          path: developer/build/outputs/apk/debug
      - uses: actions/download-artifact@v4
        with:
          name: Jarvis-Developer-device-test-APK
          path: developer/build/outputs/apk/androidTest/debug
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          profile: pixel_2
          emulator-boot-timeout: 300
          disable-animations: true
          script: bash developer/tools/personal_repair_acceptance.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Jarvis-Developer-Personal-repair-device-results
          path: personal-repair-device-results.txt
          if-no-files-found: error
  developer-debug:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Check repository theme contract
        run: python3 scripts/check_ui_theme.py
      - name: Test candidate, recovery and native-validation policy
        run: |
          python3 -m unittest discover -s developer/tools -p 'candidate_*_test.py' -v
          python3 -m unittest discover -s developer/tools -p 'developer_backup_test.py' -v
          python3 -m unittest discover -s developer/tools -p 'device_validation_test.py' -v
          python3 -m unittest discover -s developer/tools -p 'scaffold_build_evidence_test.py' -v
          python3 -m unittest discover -s scripts/tests -p 'test_job_apk_evidence.py' -v
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - name: Test, lint and build standalone Developer APK
        run: |
          python3 -m pip install --quiet Pillow
          python3 developer/tools/transparent_reactor.py
          python3 developer/tools/verify_approved_artwork.py
          chmod +x ./gradlew
          ./gradlew --no-daemon :developer:testDebugUnitTest :developer:lintDebug :developer:assembleDebug :developer:assembleDebugAndroidTest
      - name: Record bounded acceptance evidence in CI logs
        if: always()
        run: |
          python3 - <<'PY'
          import hashlib, json, os, pathlib, xml.etree.ElementTree as ET
          results = pathlib.Path('developer/build/test-results/testDebugUnitTest')
          files = sorted(results.glob('TEST-*.xml'))
          assert 0 < len(files) <= 50, 'Expected bounded JUnit XML evidence'
          assert sum(p.stat().st_size for p in files) <= 2_000_000, 'JUnit evidence exceeds budget'
          totals = dict.fromkeys(('tests', 'failures', 'errors', 'skipped'), 0)
          suites, cases = [], []
          for path in files:
              data = path.read_bytes()
              suite = ET.fromstring(data)
              counts = {key: int(suite.attrib[key]) for key in totals}
              assert all(value >= 0 for value in counts.values())
              children = suite.findall('testcase')
              assert counts['tests'] == len(children), 'JUnit count mismatch'
              for key in totals:
                  totals[key] += counts[key]
              suites.append(dict(name=suite.attrib['name'], sha256=hashlib.sha256(data).hexdigest(), **counts))
              for case in children:
                  state = next((name for name in ('failure', 'error', 'skipped') if case.find(name) is not None), 'passed')
                  cases.append(dict(suite=suite.attrib['name'], name=case.attrib['name'], result=state))
          summary = dict(sourceCommit=os.environ['GITHUB_SHA'], totals=totals, suites=suites, cases=cases)
          encoded = json.dumps(summary, separators=(',', ':'))
          assert len(encoded.encode()) <= 100_000, 'JUnit summary exceeds log budget'
          print('JARVIS_JUNIT_SUMMARY=' + encoded)
          evidence = pathlib.Path('developer/build/reports/phase3-acceptance/two-session-evidence.json')
          assert evidence.is_file() and evidence.stat().st_size <= 64_000, 'Expected bounded Phase 3 evidence'
          data = evidence.read_bytes()
          decoded = json.loads(data)
          assert decoded['baseCommitSha'] == os.environ['GITHUB_SHA'], 'Phase 3 source revision mismatch'
          print('JARVIS_PHASE3_EVIDENCE_SHA256=' + hashlib.sha256(data).hexdigest())
          print('JARVIS_PHASE3_EVIDENCE=' + json.dumps(decoded, separators=(',', ':')))
          evidence = pathlib.Path('developer/build/reports/phase4-acceptance/seeded-repair-evidence.json')
          assert evidence.is_file() and evidence.stat().st_size <= 64_000, 'Expected bounded Phase 4 evidence'
          data = evidence.read_bytes()
          decoded = json.loads(data)
          assert decoded['actualExecutionCheckoutSha'] == os.environ['GITHUB_SHA'], 'Phase 4 source revision mismatch'
          print('JARVIS_PHASE4_EVIDENCE_SHA256=' + hashlib.sha256(data).hexdigest())
          print('JARVIS_PHASE4_EVIDENCE=' + json.dumps(decoded, separators=(',', ':')))
          evidence = pathlib.Path('developer/build/reports/phase5-acceptance/self-development-evidence.json')
          assert evidence.is_file() and evidence.stat().st_size <= 64_000, 'Expected bounded Phase 5 evidence'
          data = evidence.read_bytes()
          decoded = json.loads(data)
          assert decoded['actualExecutionCheckoutSha'] == os.environ['GITHUB_SHA'], 'Phase 5 source revision mismatch'
          print('JARVIS_PHASE5_EVIDENCE_SHA256=' + hashlib.sha256(data).hexdigest())
          print('JARVIS_PHASE5_EVIDENCE=' + json.dumps(decoded, separators=(',', ':')))
          lint = pathlib.Path('developer/build/reports/lint-results-debug.xml')
          assert lint.is_file() and lint.stat().st_size <= 2_000_000, 'Expected bounded lint XML evidence'
          data = lint.read_bytes()
          issues = ET.fromstring(data).findall('issue')
          errors = sum(issue.attrib.get('severity') in ('Error', 'Fatal') for issue in issues)
          warnings = sum(issue.attrib.get('severity') == 'Warning' for issue in issues)
          print('JARVIS_LINT_SUMMARY=' + json.dumps(dict(sourceCommit=os.environ['GITHUB_SHA'],
              sha256=hashlib.sha256(data).hexdigest(), errors=errors, warnings=warnings), separators=(',', ':')))
          indexed = []
          for issue in issues:
              location = issue.find('location')
              if location is None:
                  continue
              path = pathlib.Path(location.attrib.get('file', ''))
              if path.is_absolute():
                  try:
                      path = path.relative_to(pathlib.Path.cwd())
                  except ValueError:
                      path = pathlib.Path(path.name)
              indexed.append(dict(id=issue.attrib.get('id'), severity=issue.attrib.get('severity'),
                  path=str(path), line=location.attrib.get('line')))
          encoded = json.dumps(indexed, separators=(',', ':'))
          assert len(indexed) <= 1_000 and len(encoded.encode()) <= 160_000, 'Lint index exceeds budget'
          print('JARVIS_LINT_ISSUES=' + encoded)
          assert errors == 0, 'Lint errors remain'
          PY
      - name: Record compiled debug app and device-test identities without installing
        run: |
          python3 - <<'PY'
          import hashlib, json, os, pathlib, re, subprocess
          tools = pathlib.Path(os.environ['ANDROID_HOME']) / 'build-tools' / '34.0.0'
          records = []
          for directory, package in [('debug', 'com.jarvis.developer'), ('androidTest/debug', 'com.jarvis.developer.test')]:
              apks = list((pathlib.Path('developer/build/outputs/apk') / directory).glob('*.apk'))
              assert len(apks) == 1, 'Expected exactly one compiled APK per fixed directory'
              apk = apks[0]
              data = apk.read_bytes()
              assert 0 < len(data) <= 64_000_000, 'Compiled APK exceeds budget'
              badging = subprocess.check_output([str(tools / 'aapt'), 'dump', 'badging', str(apk)], text=True)
              assert re.search(r"^package: name='" + re.escape(package) + "'", badging, re.M), 'Unexpected APK package'
              signatures = subprocess.check_output([str(tools / 'apksigner'), 'verify', '--print-certs', str(apk)], text=True)
              certs = re.findall(r'^Signer #[0-9]+ certificate SHA-256 digest: ([a-f0-9]{64})$', signatures, re.M)
              assert len(certs) == 1, 'Expected one verified debug signer'
              records.append(dict(packageName=package, bytes=len(data), apkSha256=hashlib.sha256(data).hexdigest(), signerSha256=certs[0]))
          assert records[0]['signerSha256'] == records[1]['signerSha256'], 'App/test debug signers differ'
          result = dict(schemaVersion=1, sourceCommit=os.environ['GITHUB_SHA'], installed=False, apks=records)
          raw = json.dumps(result, sort_keys=True, separators=(',', ':')).encode()
          output = pathlib.Path('developer/build/reports/device-validation/compiled-apks.json')
          output.parent.mkdir(parents=True, exist_ok=True)
          output.write_bytes(raw)
          print('JARVIS_DEVICE_TEST_BUILD_SHA256=' + hashlib.sha256(raw).hexdigest())
          print('JARVIS_DEVICE_TEST_BUILD=' + raw.decode())
          PY
      - name: Upload Developer unit-test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Jarvis-Developer-unit-test-results
          path: developer/build/test-results/testDebugUnitTest/
          if-no-files-found: warn
      - name: Upload reviewed Phase 2 acceptance proposal
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Jarvis-Developer-phase2-reviewed-proposal
          path: developer/build/reports/phase2-acceptance/
          if-no-files-found: warn
      - name: Upload Phase 3 checkpoint acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Jarvis-Developer-phase3-checkpoint-evidence
          path: developer/build/reports/phase3-acceptance/
          if-no-files-found: warn
      - name: Upload Phase 4 seeded repair evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Jarvis-Developer-phase4-seeded-repair-evidence
          path: developer/build/reports/phase4-acceptance/
          if-no-files-found: warn
      - name: Upload Developer lint evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Jarvis-Developer-lint-results
          path: developer/build/reports/lint-results-debug.*
          if-no-files-found: warn
      - name: Upload Phase 5 controlled self-development evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Jarvis-Developer-phase5-self-development-evidence
          path: developer/build/reports/phase5-acceptance/
          if-no-files-found: warn
      - name: Bind the existing debug APK to its actual source and workflow
        run: |
          mkdir -p developer/build/reports/job-artifact
          cp developer/build/outputs/apk/debug/developer-debug.apk developer/build/reports/job-artifact/
          python3 scripts/job_apk_evidence.py --directory developer/build/reports/job-artifact --target DEVELOPER --signing debug
      - uses: actions/upload-artifact@v4
        with:
          name: Jarvis-Developer-debug-APK
          path: developer/build/reports/job-artifact/
          if-no-files-found: error
      - name: Upload compiled device tests without installing
        uses: actions/upload-artifact@v4
        with:
          name: Jarvis-Developer-device-test-APK
          path: developer/build/outputs/apk/androidTest/debug/*.apk
          if-no-files-found: error
      - name: Upload compiled device-test identity evidence
        uses: actions/upload-artifact@v4
        with:
          name: Jarvis-Developer-device-test-build-evidence
          path: developer/build/reports/device-validation/compiled-apks.json
          if-no-files-found: error
      - name: Verify immutable approved Phase 6 scaffold sources
        run: |
          for platform in android backend windows; do
            python3 developer/tools/scaffold_build_evidence.py verify --root developer/build/reports/phase6-acceptance --platform "$platform"
          done
      - name: Upload separate Phase 6 scaffold source previews
        uses: actions/upload-artifact@v4
        with:
          name: Jarvis-Developer-phase6-scaffold-sources
          path: |
            developer/build/reports/phase6-acceptance/evidence.json
            developer/build/reports/phase6-acceptance/android.zip
            developer/build/reports/phase6-acceptance/backend.zip
            developer/build/reports/phase6-acceptance/windows.zip
            developer/build/reports/phase6-acceptance/android/
            developer/build/reports/phase6-acceptance/backend/
            developer/build/reports/phase6-acceptance/windows/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14

  phase6-android-preview:
    needs: developer-debug
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: Jarvis-Developer-phase6-scaffold-sources
          path: developer/build/reports/phase6-acceptance/
      - name: Verify exact-source Android scaffold before building
        run: python3 developer/tools/scaffold_build_evidence.py verify --root developer/build/reports/phase6-acceptance --platform android
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - name: Test and build independent Android debug preview without installing
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon -p developer/build/reports/phase6-acceptance/android :app:testDebugUnitTest :app:assembleDebug
      - name: Record actual Android test and APK identity evidence
        run: python3 developer/tools/scaffold_build_evidence.py record --root developer/build/reports/phase6-acceptance --platform android
      - name: Retain independent Android preview and test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Jarvis-Developer-phase6-Android-preview
          path: |
            developer/build/reports/phase6-acceptance/android/app/build/outputs/apk/debug/*.apk
            developer/build/reports/phase6-acceptance/android/app/build/test-results/testDebugUnitTest/
            developer/build/reports/phase6-acceptance/android-build-evidence.json
          if-no-files-found: warn
          retention-days: 14

  phase6-backend-preview:
    needs: developer-debug
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: Jarvis-Developer-phase6-scaffold-sources
          path: developer/build/reports/phase6-acceptance/
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify exact-source backend scaffold before running tests
        run: python3 developer/tools/scaffold_build_evidence.py verify --root developer/build/reports/phase6-acceptance --platform backend
      - name: Run generated backend contracts against ephemeral loopback service
        shell: bash
        run: |
          python3 -m unittest discover -s developer/build/reports/phase6-acceptance/backend -v 2>&1 | tee developer/build/reports/phase6-acceptance/backend-tests.log
      - name: Record actual backend test evidence
        run: python3 developer/tools/scaffold_build_evidence.py record --root developer/build/reports/phase6-acceptance --platform backend
      - name: Retain independent backend preview and evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Jarvis-Developer-phase6-backend-preview
          path: |
            developer/build/reports/phase6-acceptance/backend.zip
            developer/build/reports/phase6-acceptance/backend-tests.log
            developer/build/reports/phase6-acceptance/backend-build-evidence.json
          if-no-files-found: warn
          retention-days: 14

  phase6-windows-preview:
    needs: developer-debug
    runs-on: windows-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: Jarvis-Developer-phase6-scaffold-sources
          path: developer/build/reports/phase6-acceptance/
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Verify exact-source Windows scaffold before building
        run: python developer/tools/scaffold_build_evidence.py verify --root developer/build/reports/phase6-acceptance --platform windows
      - name: Build Windows preview and run actual STA WinForms smoke checks
        shell: pwsh
        run: |
          dotnet build developer/build/reports/phase6-acceptance/windows/app/StarterApp.csproj --configuration Release --nologo
          if ($LASTEXITCODE -ne 0) { throw 'Windows preview compilation failed' }
          dotnet run --project developer/build/reports/phase6-acceptance/windows/smoke/StarterSmoke.csproj --configuration Release 2>&1 | Tee-Object -FilePath developer/build/reports/phase6-acceptance/windows-smoke.log
          if ($LASTEXITCODE -ne 0) { throw 'Windows STA smoke checks failed' }
      - name: Record actual Windows compilation and smoke evidence
        run: python developer/tools/scaffold_build_evidence.py record --root developer/build/reports/phase6-acceptance --platform windows
      - name: Retain independent Windows preview and evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Jarvis-Developer-phase6-Windows-preview
          path: |
            developer/build/reports/phase6-acceptance/windows/app/bin/Release/net8.0-windows/
            developer/build/reports/phase6-acceptance/windows-smoke.log
            developer/build/reports/phase6-acceptance/windows-build-evidence.json
          if-no-files-found: warn
          retention-days: 14
