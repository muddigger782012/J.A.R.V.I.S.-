name: Restore legacy Jarvis source after owner approval
on:
  workflow_dispatch:
    inputs:
      confirm_archive_restore:
        description: 'Restore the legacy v3.3 archive into the selected recovery/legacy-source-* branch for review'
        required: true
        type: boolean
        default: false
permissions:
  contents: write
jobs:
  publish:
    if: github.event_name == 'workflow_dispatch' && github.ref_type == 'branch' && startsWith(github.ref_name, 'recovery/legacy-source-') && inputs.confirm_archive_restore == true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - name: Unpack the working Android source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/jarvis-unpacked
          unzip -q Jarvis-AI-cloud-build-v3.3.zip -d /tmp/jarvis-unpacked
          root=/tmp/jarvis-unpacked
          if [ ! -f "$root/settings.gradle" ] && [ ! -f "$root/settings.gradle.kts" ]; then
            mapfile -t matches < <(find "$root" -maxdepth 3 -type f \( -name settings.gradle -o -name settings.gradle.kts \))
            if [ "${#matches[@]}" -ne 1 ]; then
              echo "Expected exactly one Gradle project, found ${#matches[@]}"
              exit 1
            fi
            root="$(dirname "${matches[0]}")"
          fi
          find "$root/.github/workflows" -type f -delete 2>/dev/null || true
          cp -a "$root"/. .
          echo "Extracted Android project into repository root without embedded workflow files"
      - name: Commit source files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Source already committed"
          else
            git commit -m "Publish Jarvis Android source from verified v3.3 archive"
            git push
          fi
