name: Local assistant checks
on:
  pull_request:
  push:
    branches: ['fix/local-date-math']
permissions:
  contents: read
# A new PR revision supersedes its older emulator run; avoid a backlog of
# slow ARM64 emulators competing for GitHub Actions runners.
concurrency:
  group: local-assistant-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: android-actions/setup-android@v4
      - run: sdkmanager 'platforms;android-34' 'build-tools;34.0.0'
      - name: Restore sherpa-onnx AAR required by Gradle
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p app/libs
          curl --fail --location --retry 3 --retry-all-errors \
            --output app/libs/sherpa-onnx-1.13.8.aar \
            https://github.com/k2-fsa/sherpa-onnx/releases/download/v1.13.8/sherpa-onnx-1.13.8.aar
          test -s app/libs/sherpa-onnx-1.13.8.aar
          unzip -tq app/libs/sherpa-onnx-1.13.8.aar
      - name: Report packaged native ABIs
        shell: bash
        run: |
          echo "Sherpa native libraries:"
          unzip -Z1 app/libs/sherpa-onnx-1.13.8.aar | grep '^jni/.*[.]so' | cut -d/ -f2 | sort -u
          echo "Supported APK splits:"
          grep -A6 'splits {' app/build.gradle
      - run: bash gradlew --no-daemon testDebugUnitTest assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: layout-smoke-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
  gateway:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r cloud-backend/requirements.txt
      - run: python -m unittest discover -s cloud-backend -p 'test_*.py'
      - name: Validate Android UI smoke script syntax
        run: python -m py_compile scripts/ui_layout_smoke.py

  ui-layout:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/download-artifact@v4
        with:
          name: layout-smoke-apk
          path: app/build/outputs/apk/debug
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          emulator-boot-timeout: 300
          profile: pixel_2
          disable-animations: true
          script: python scripts/ui_layout_smoke.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jarvis-ui-review
          path: ui-review/
