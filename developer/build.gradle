plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}
android {
    namespace 'com.jarvis.developer'
    compileSdk 34
    defaultConfig {
        applicationId 'com.jarvis.developer'
        minSdk 26
        targetSdk 34
        versionCode Integer.parseInt(System.getenv('DEVELOPER_VERSION_CODE') ?: '1')
        versionName System.getenv('DEVELOPER_VERSION_NAME') ?: '0.1.0'
    }
    buildFeatures { buildConfig true }
    signingConfigs {
        release {
            def path = System.getenv('JARVIS_SIGNING_STORE_FILE')
            if (path) {
                storeFile file(path)
                storePassword System.getenv('JARVIS_SIGNING_STORE_PASSWORD')
                keyAlias System.getenv('JARVIS_SIGNING_KEY_ALIAS')
                keyPassword System.getenv('JARVIS_SIGNING_KEY_PASSWORD')
            }
        }
    }
    buildTypes {
        release { signingConfig signingConfigs.release }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions { jvmTarget = '17' }
    testOptions {
        unitTests.all {
            systemProperty 'jarvis.repositoryRoot', rootProject.projectDir.absolutePath
            // CI checks the immutable revision actually checked out by Actions.
            // A local exported snapshot must supply its provenance explicitly.
            systemProperty 'jarvis.repositoryCommit', System.getenv('GITHUB_SHA') ?:
                project.findProperty('jarvisRepositoryCommit') ?: ''
        }
    }
}

dependencies {
    implementation 'androidx.core:core:1.13.1'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20240303'
}

